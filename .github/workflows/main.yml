name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore IndustrialSystem.slnx

      - name: Build
        run: dotnet build IndustrialSystem.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/IndustrialSystem.Tests/IndustrialSystem.Tests.csproj --configuration Release --no-restore
